services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aijobplatform
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: aijob_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijobplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_SECRET_KEY: "change-me-in-production"
      DATABASE_URL: "postgres://aijob:aijob_dev_password@postgres:5432/aijobplatform"
      POSTGRES_SSLMODE: "disable"
      USE_REDIS: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      STRIPE_SECRET_KEY: ""
      STRIPE_PUBLISHABLE_KEY: ""
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

  celery:
    build:
      context: ./backend
    command: ["celery", "-A", "core", "worker", "--loglevel=info"]
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "change-me-in-production"
      DATABASE_URL: "postgres://aijob:aijob_dev_password@postgres:5432/aijobplatform"
      POSTGRES_SSLMODE: "disable"
      USE_REDIS: "True"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  media_data:
