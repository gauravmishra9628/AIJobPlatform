# Render Blueprint for AI Job Platform
# Use this file when deploying the whole monorepo from the AIJobPlatform root.

services:
  - type: web
    name: aijobplatform-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "uvicorn core.asgi:application --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: USE_REDIS
        value: "True"
      - key: API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: aijobplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aijobplatform-redis
          property: connectionString

  - type: worker
    name: aijobplatform-celery
    runtime: python
    rootDir: backend
    region: oregon
    plan: standard
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A core worker --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aijobplatform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aijobplatform-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: aijobplatform-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: aijobplatform-redis
          property: connectionString

  - type: web
    name: aijobplatform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_AUTH_BASE
        value: https://aijobplatform-api.onrender.com/api/auth
      - key: VITE_API_JOBS_BASE
        value: https://aijobplatform-api.onrender.com/api/jobs
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: aijobplatform-redis
    region: oregon
    plan: standard
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: aijobplatform-db
    plan: standard
    region: oregon
