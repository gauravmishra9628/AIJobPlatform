apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aijobplatform-ingress
  namespace: aijobplatform
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
    - hosts:
        - api.aijobplatform.com
        - app.aijobplatform.com
      secretName: aijobplatform-tls
  rules:
    - host: app.aijobplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aijobplatform-frontend
                port:
                  number: 80
    - host: api.aijobplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aijobplatform-backend
                port:
                  number: 8000
---
apiVersion: v1
kind: Namespace
metadata:
  name: aijobplatform
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: aijobplatform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: aijobplatform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: aijobplatform