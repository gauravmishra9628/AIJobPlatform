apiVersion: apps/v1
kind: Deployment
metadata:
  name: aijobplatform-celery
  namespace: aijobplatform
  labels:
    app: celery
    tier: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
        tier: worker
    spec:
      containers:
        - name: celery
          image: aijobplatform/backend:latest
          command: ["celery", "-A", "core", "worker", "--loglevel=info", "--concurrency=4"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aijobplatform-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: aijobplatform-config
                  key: redis-url
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: aijobplatform-config
                  key: redis-url
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: aijobplatform-config
                  key: redis-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"